name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke test (status line through bash, like Claude Code with Git Bash on Windows)
        shell: bash
        env:
          CLAUDE_JAUGE_HOME: ${{ runner.temp }}/claude-jauge
          NO_COLOR: '1'
        run: |
          node dist/src/cli.js --version
          reset=$(( $(date +%s) + 3600 ))
          echo "{\"rate_limits\":{\"five_hour\":{\"used_percentage\":12,\"resets_at\":$reset}}}" | node dist/src/cli.js statusline --lang en | tee out.txt
          grep -q "5h: 12%" out.txt
          node dist/src/cli.js --lang en | grep -q "12% used"
      - name: Package contents
        run: npm pack --dry-run

  desktop:
    name: desktop · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Front end (type check + build)
        run: npm run build
        working-directory: desktop
      - name: Rust tests
        run: cargo test --locked
        working-directory: desktop/src-tauri
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - name: Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build
        working-directory: desktop
      - name: Upload the installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: claude-jauge-windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

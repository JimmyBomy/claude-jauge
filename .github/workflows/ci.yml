name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke test (status line through bash, like Claude Code with Git Bash on Windows)
        shell: bash
        env:
          CLAUDE_JAUGE_HOME: ${{ runner.temp }}/claude-jauge
          NO_COLOR: '1'
        run: |
          node dist/src/cli.js --version
          reset=$(( $(date +%s) + 3600 ))
          echo "{\"rate_limits\":{\"five_hour\":{\"used_percentage\":12,\"resets_at\":$reset}}}" | node dist/src/cli.js statusline --lang en | tee out.txt
          grep -q "5h: 12%" out.txt
          node dist/src/cli.js --lang en | grep -q "12% used"
      - name: Package contents
        run: npm pack --dry-run

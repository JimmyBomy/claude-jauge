name: Release

# Pushing a tag like v0.1.0 builds the Windows installer and publishes it in GitHub Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: desktop
      - name: Release notes (from .github/release-notes/<tag>.md when it exists)
        id: notes
        shell: bash
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo 'body<<NOTES_END'
            if [ -f "$file" ]; then cat "$file"; else echo "Voir CHANGELOG.md / See CHANGELOG.md"; fi
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: claude-jauge ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

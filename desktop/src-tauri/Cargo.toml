[package]
name = "claude-jauge-desktop"
version = "0.1.1"
description = "claude-jauge desktop widget"
authors = ["Jimmy Bomy"]
license = "MIT"
repository = "https://github.com/JimmyBomy/claude-jauge"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "claude_jauge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
sys-locale = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
